name: Build cross-platform release assets

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 packages
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: |
          npm run typecheck
          npm test

      - name: Build Windows installer and application
        run: npm run desktop:windows:setup

      - name: Create Windows release packages
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $portableRoot = "release/OpsLog"
          $executable = "src-tauri/target/release/opslog.exe"
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (!(Test-Path $executable)) {
            throw "Portable executable was not found: $executable"
          }
          if ($null -eq $installer) {
            throw "NSIS installer was not found"
          }
          New-Item -ItemType Directory -Force -Path $portableRoot | Out-Null
          Copy-Item $executable "$portableRoot/OpsLog.exe"
          Copy-Item opslog-envs.example.json "$portableRoot/opslog-envs.example.json"
          Copy-Item README.md "$portableRoot/README.md"
          Compress-Archive -Path $portableRoot -DestinationPath "release/OpsLog_${packageVersion}_windows_x64_portable.zip" -Force
          Copy-Item $installer.FullName "release/OpsLog_${packageVersion}_windows_x64_setup.exe"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: OpsLog-Windows-x64-${{ github.ref_name }}
          path: |
            release/*_windows_x64_portable.zip
            release/*_windows_x64_setup.exe
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS ${{ matrix.arch }} packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            target: aarch64-apple-darwin
            expected_mach_o: arm64
          - runner: macos-14
            arch: x64
            target: x86_64-apple-darwin
            expected_mach_o: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Confirm Apple Silicon build host
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Build macOS application and disk image
        run: npm run desktop:macos -- --target ${{ matrix.target }}

      - name: Create macOS portable archive
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          bundle_root="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p release
          dmg="$(find "$bundle_root/dmg" -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          app_path="$bundle_root/macos/OpsLog.app"
          test -d "$app_path"
          executable="$(find "$app_path/Contents/MacOS" -type f -perm -111 -print -quit)"
          file "$executable" | grep -q "${{ matrix.expected_mach_o }}"
          cp "$dmg" "release/OpsLog_${package_version}_macos_${{ matrix.arch }}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "release/OpsLog_${package_version}_macos_${{ matrix.arch }}_portable.zip"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: OpsLog-macOS-${{ matrix.arch }}-${{ github.ref_name }}
          path: |
            release/*_macos_${{ matrix.arch }}.dmg
            release/*_macos_${{ matrix.arch }}_portable.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs:
      - windows
      - macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all release packages
        uses: actions/download-artifact@v4
        with:
          pattern: OpsLog-*
          path: release
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sha256sum release/*.zip release/*.dmg release/*.exe > release/SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" release/*.zip release/*.dmg release/*.exe release/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "OpsLog ${GITHUB_REF_NAME#v}" \
            --generate-notes
