name: Build Windows application

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 NSIS package
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: |
          npm run typecheck
          npm test

      - name: Build NSIS installer
        run: npm run desktop:windows

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: OpsLog-Windows-x64-${{ github.ref_name }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: OpsLog-Windows-x64-${{ github.ref_name }}
          path: release

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sha256sum release/*.exe > release/SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" release/*.exe release/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "OpsLog ${GITHUB_REF_NAME#v}" \
            --generate-notes
