name: Build Windows application

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 portable package
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: |
          npm run typecheck
          npm test

      - name: Build portable application
        run: npm run desktop:windows

      - name: Create portable archive
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $portableRoot = "release/OpsLog"
          $executable = "src-tauri/target/release/opslog.exe"
          if (!(Test-Path $executable)) {
            throw "Portable executable was not found: $executable"
          }
          New-Item -ItemType Directory -Force -Path $portableRoot | Out-Null
          Copy-Item $executable "$portableRoot/OpsLog.exe"
          Copy-Item opslog-envs.example.json "$portableRoot/opslog-envs.example.json"
          Copy-Item README.md "$portableRoot/README.md"
          Compress-Archive -Path $portableRoot -DestinationPath "release/OpsLog_${packageVersion}_windows_x64_portable.zip" -Force

      - name: Upload Windows portable package
        uses: actions/upload-artifact@v4
        with:
          name: OpsLog-Windows-x64-${{ github.ref_name }}
          path: release/*_windows_x64_portable.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows portable package
        uses: actions/download-artifact@v4
        with:
          name: OpsLog-Windows-x64-${{ github.ref_name }}
          path: release

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sha256sum release/*.zip > release/SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" release/*.zip release/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "OpsLog ${GITHUB_REF_NAME#v}" \
            --generate-notes
