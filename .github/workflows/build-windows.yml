name: Build cross-platform release assets

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: opslog-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 packages
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: |
          npm run typecheck
          npm test

      - name: Verify updater signing configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "GitHub Secret TAURI_SIGNING_PRIVATE_KEY is required"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "GitHub Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required"
          }

      - name: Build Windows installer and application
        run: npm run desktop:windows:setup -- --config src-tauri/tauri.release.conf.json

      - name: Create Windows release packages
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $portableRoot = "release/OpsLog"
          $executable = "src-tauri/target/release/opslog.exe"
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (!(Test-Path $executable)) {
            throw "Portable executable was not found: $executable"
          }
          if ($null -eq $installer) {
            throw "NSIS installer was not found"
          }
          $installerSignature = "$($installer.FullName).sig"
          if (!(Test-Path $installerSignature)) {
            throw "Signed updater artifact was not found: $installerSignature"
          }
          New-Item -ItemType Directory -Force -Path $portableRoot | Out-Null
          Copy-Item $executable "$portableRoot/OpsLog.exe"
          Copy-Item opslog-envs.example.json "$portableRoot/opslog-envs.example.json"
          Copy-Item README.md "$portableRoot/README.md"
          Compress-Archive -Path $portableRoot -DestinationPath "release/OpsLog_${packageVersion}_windows_x64_portable.zip" -Force
          Copy-Item $installer.FullName "release/OpsLog_${packageVersion}_windows_x64_setup.exe"
          Copy-Item $installerSignature "release/OpsLog_${packageVersion}_windows_x64_setup.exe.sig"

      - name: Build OpsLog Reader for Windows
        env:
          # Cargo resolves this path relative to the Rust manifest directory
          # (src-tauri), so use an absolute path to avoid src-tauri/src-tauri.
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target/reader
        run: npm run reader:windows:setup -- --config src-tauri/tauri.release.conf.json

      - name: Create OpsLog Reader Windows packages
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $portableRoot = "release/OpsLog Reader"
          $executable = "src-tauri/target/reader/release/opslog-reader.exe"
          $installer = Get-ChildItem "src-tauri/target/reader/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (!(Test-Path $executable)) {
            throw "OpsLog Reader executable was not found: $executable"
          }
          if ($null -eq $installer) {
            throw "OpsLog Reader NSIS installer was not found"
          }
          $installerSignature = "$($installer.FullName).sig"
          if (!(Test-Path $installerSignature)) {
            throw "OpsLog Reader signed updater artifact was not found: $installerSignature"
          }
          New-Item -ItemType Directory -Force -Path $portableRoot | Out-Null
          Copy-Item $executable "$portableRoot/OpsLog Reader.exe"
          Copy-Item README.md "$portableRoot/README.md"
          Compress-Archive -Path $portableRoot -DestinationPath "release/OpsLog_Reader_${packageVersion}_windows_x64_portable.zip" -Force
          Copy-Item $installer.FullName "release/OpsLog_Reader_${packageVersion}_windows_x64_setup.exe"
          Copy-Item $installerSignature "release/OpsLog_Reader_${packageVersion}_windows_x64_setup.exe.sig"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: OpsLog-Windows-x64-${{ github.ref_name }}
          path: |
            release/*_windows_x64_portable.zip
            release/*_windows_x64_setup.exe
            release/*_windows_x64_setup.exe.sig
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS ${{ matrix.arch }} packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            target: aarch64-apple-darwin
            expected_mach_o: arm64
          - runner: macos-14
            arch: x64
            target: x86_64-apple-darwin
            expected_mach_o: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Confirm Apple Silicon build host
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Verify updater signing configuration
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "GitHub Secret TAURI_SIGNING_PRIVATE_KEY is required" >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "GitHub Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required" >&2; exit 1; }

      - name: Build macOS application and disk image
        run: npm run desktop:macos -- --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json

      - name: Create macOS portable archive
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          bundle_root="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p release
          dmg="$(find "$bundle_root/dmg" -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          app_path="$bundle_root/macos/OpsLog.app"
          test -d "$app_path"
          executable="$(find "$app_path/Contents/MacOS" -type f -perm -111 -print -quit)"
          file "$executable" | grep -q "${{ matrix.expected_mach_o }}"
          updater_archive="$(find "$bundle_root/macos" -type f -name '*.app.tar.gz' -print -quit)"
          test -n "$updater_archive"
          test -f "$updater_archive.sig"
          cp "$dmg" "release/OpsLog_${package_version}_macos_${{ matrix.arch }}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "release/OpsLog_${package_version}_macos_${{ matrix.arch }}_portable.zip"
          cp "$updater_archive" "release/OpsLog_${package_version}_macos_${{ matrix.arch }}.app.tar.gz"
          cp "$updater_archive.sig" "release/OpsLog_${package_version}_macos_${{ matrix.arch }}.app.tar.gz.sig"

      - name: Build OpsLog Reader for macOS
        env:
          # Cargo resolves this path relative to the Rust manifest directory
          # (src-tauri), so use an absolute path to avoid src-tauri/src-tauri.
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target/reader
        run: npm run reader:macos -- --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json

      - name: Create OpsLog Reader macOS portable archive
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          bundle_root="src-tauri/target/reader/${{ matrix.target }}/release/bundle"
          dmg="$(find "$bundle_root/dmg" -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          app_path="$bundle_root/macos/OpsLog Reader.app"
          test -d "$app_path"
          executable="$(find "$app_path/Contents/MacOS" -type f -perm -111 -print -quit)"
          file "$executable" | grep -q "${{ matrix.expected_mach_o }}"
          updater_archive="$(find "$bundle_root/macos" -type f -name '*.app.tar.gz' -print -quit)"
          test -n "$updater_archive"
          test -f "$updater_archive.sig"
          cp "$dmg" "release/OpsLog_Reader_${package_version}_macos_${{ matrix.arch }}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "release/OpsLog_Reader_${package_version}_macos_${{ matrix.arch }}_portable.zip"
          cp "$updater_archive" "release/OpsLog_Reader_${package_version}_macos_${{ matrix.arch }}.app.tar.gz"
          cp "$updater_archive.sig" "release/OpsLog_Reader_${package_version}_macos_${{ matrix.arch }}.app.tar.gz.sig"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: OpsLog-macOS-${{ matrix.arch }}-${{ github.ref_name }}
          path: |
            release/*_macos_${{ matrix.arch }}.dmg
            release/*_macos_${{ matrix.arch }}_portable.zip
            release/*_macos_${{ matrix.arch }}.app.tar.gz
            release/*_macos_${{ matrix.arch }}.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub and Gitea Releases
    needs:
      - windows
      - macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download all release packages
        uses: actions/download-artifact@v4
        with:
          pattern: OpsLog-*
          path: release
          merge-multiple: true

      - name: Prepare mirrored release manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          committed_notes="docs/releases/${GITHUB_REF_NAME}.md"
          if test -s "$committed_notes"; then
            cp "$committed_notes" release-notes.md
          else
            gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json body \
              | node -e 'let json = ""; process.stdin.on("data", chunk => json += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(json).body));' \
              > release-notes.md 2>/dev/null || true
          fi
          if ! test -s release-notes.md; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${GITHUB_REF_NAME}" \
              -f target_commitish="${GITHUB_SHA}" \
              | node -e 'let json = ""; process.stdin.on("data", chunk => json += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(json).body));' \
              > release-notes.md
          fi
          test -s release-notes.md
          release_date="$(git show -s --format=%cI "$GITHUB_SHA")"
          node scripts/generate-update-manifest.mjs release publish/github "${GITHUB_REF_NAME#v}" \
            "https://github.com/AlawnCN/opslog-release/releases/download" "$GITHUB_REF_NAME" release-notes.md "$release_date"
          node scripts/generate-update-manifest.mjs release publish/gitea "${GITHUB_REF_NAME#v}" \
            "https://git.alawn.cn/Alawn/opslog-release/releases/download" "$GITHUB_REF_NAME" release-notes.md "$release_date"
          node scripts/write-release-checksums.mjs release publish/github
          node scripts/write-release-checksums.mjs release publish/gitea

      - name: Verify mirror publishing credentials
        env:
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GITEA_RELEASE_TOKEN: ${{ secrets.GITEA_RELEASE_TOKEN }}
        shell: bash
        run: |
          test -n "$GH_RELEASE_TOKEN" || { echo "GH_RELEASE_TOKEN is required for AlawnCN/opslog-release" >&2; exit 1; }
          test -n "$GITEA_RELEASE_TOKEN" || { echo "GITEA_RELEASE_TOKEN is required for Alawn/opslog-release" >&2; exit 1; }

      - name: Publish and verify Gitea release
        env:
          GITEA_RELEASE_TOKEN: ${{ secrets.GITEA_RELEASE_TOKEN }}
        run: node scripts/publish-gitea-release.mjs "$GITHUB_REF_NAME" release publish/gitea release-notes.md

      - name: Publish and verify GitHub mirror release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          target_repo="AlawnCN/opslog-release"
          if gh release view "$GITHUB_REF_NAME" --repo "$target_repo" >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" --repo "$target_repo" --json isDraft --jq .isDraft)"
            if test "$is_draft" = true; then
              gh release upload "$GITHUB_REF_NAME" release/* publish/github/* --repo "$target_repo" --clobber
            fi
          else
            is_draft=true
            gh release create "$GITHUB_REF_NAME" release/* publish/github/* \
              --repo "$target_repo" --target main --draft \
              --title "OpsLog ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
          fi
          node scripts/verify-github-release.mjs "$target_repo" "$GITHUB_REF_NAME" release publish/github release-notes.md
          if test "$is_draft" = true; then
            gh release edit "$GITHUB_REF_NAME" --repo "$target_repo" --draft=false --latest \
              --title "OpsLog ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
          fi
          curl --fail --location --silent --show-error --output /dev/null \
            "https://github.com/$target_repo/releases/latest/download/latest.json"
          curl --fail --location --silent --show-error --output /dev/null \
            "https://github.com/$target_repo/releases/latest/download/reader-latest.json"

      - name: Promote Gitea update manifests
        env:
          GITEA_RELEASE_TOKEN: ${{ secrets.GITEA_RELEASE_TOKEN }}
        run: node scripts/promote-gitea-manifests.mjs "$GITHUB_REF_NAME" publish/gitea

      - name: Preserve old clients' GitHub update endpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              publish/github/latest.json publish/github/reader-latest.json \
              --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
              --title "OpsLog ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
          fi
          node scripts/verify-github-release.mjs "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" - publish/github release-notes.md
          curl --fail --location --silent --show-error --output /dev/null \
            "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json"
