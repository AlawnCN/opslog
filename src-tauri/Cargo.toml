[package]
name = "opslog"
version = "3.0.18"
description = "Portable M5/Faulu log query console"
authors = ["MuRong Technology"]
license = "Proprietary"
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "opslog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
futures-util = "0.3"
getrandom = "0.3"
local-ip-address = "0.6.13"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream", "gzip", "brotli", "deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.11.0"
tokio = { version = "1", features = ["fs", "net", "sync"] }
